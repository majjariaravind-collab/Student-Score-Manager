<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Score Manager</title>
    <link rel="stylesheet" href="102.css">
  </head>
  <body>
    <h2>Student Score Manager</h2>
    <div class="student-form">
      <input type="text" class="js-name" placeholder="Student name">
      <input type="number" class="js-marks" placeholder="marks (0-100)">
      <button class="submit">Add Student</button>
    </div>
    <h3>Average Marks: <span class="js-average">0</span></h3>
    <ul class="js-student-list"></ul>
    <script src="102.js"></script>
  </body>

</html>
